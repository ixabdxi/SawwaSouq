<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Rubber Mousepad">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F4F1EA"/>
      <stop offset="1" stop-color="#E8E3D8"/>
    </linearGradient>
    <linearGradient id="pad1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F5C56"/>
      <stop offset="1" stop-color="#0A3D38"/>
    </linearGradient>
    <filter id="sh1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg1)"/>

  <!-- شبكة خطوط -->
  <g stroke="#D4CFC1" stroke-width="1" opacity="0.5">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800 M0 500 H800"/>
    <path d="M100 0 V600 M200 0 V600 M300 0 V600 M400 0 V600 M500 0 V600 M600 0 V600 M700 0 V600"/>
  </g>

  <!-- ظل -->
  <ellipse cx="400" cy="460" rx="240" ry="30" fill="#0A3D38" opacity="0.15" filter="url(#sh1)"/>

  <!-- الماوس باد بمنظور -->
  <g transform="translate(400 340)">
    <g transform="skewX(-18)">
      <rect x="-230" y="-90" width="460" height="180" fill="#0A3D38" opacity="0.4" transform="translate(6 8)"/>
      <rect x="-230" y="-90" width="460" height="180" fill="url(#pad1)" stroke="#0A3D38" stroke-width="2"/>
      <rect x="-220" y="-80" width="440" height="160" fill="none" stroke="#8FA9A5" stroke-width="1" opacity="0.4"/>
    </g>
  </g>

  <!-- دائرة زخرفية (زر الماوس) -->
  <circle cx="400" cy="340" r="40" fill="none" stroke="#E8A33D" stroke-width="3" opacity="0.9"/>
  <circle cx="400" cy="340" r="6" fill="#E8A33D"/>

  <!-- TOP LEFT: نوع المنتج -->
  <g transform="translate(40 60)">
    <rect x="0" y="0" width="140" height="30" fill="#0A3D38"/>
    <text x="70" y="20" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="11" font-weight="800" letter-spacing="3" fill="#F4F1EA">RUBBER</text>
  </g>

  <!-- TOP RIGHT: الرقم -->
  <g transform="translate(760 60)">
    <text x="0" y="0" text-anchor="end" font-family="Orbitron, sans-serif" font-size="42" font-weight="900" fill="#0A3D38">01</text>
  </g>

  <!-- BOTTOM: القياس -->
  <g transform="translate(40 560)">
    <text x="0" y="0" font-family="Orbitron, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#0A3D38">40 × 90 CM</text>
  </g>

  <!-- BOTTOM RIGHT: علامة -->
  <g transform="translate(760 560)">
    <text x="0" y="0" text-anchor="end" font-family="Orbitron, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#6B7A76">SAWWA SOUQ</text>
  </g>
</svg>