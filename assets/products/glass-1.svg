<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Glass Mousepad">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EDE8DD"/>
      <stop offset="1" stop-color="#D8D2C4"/>
    </linearGradient>
    <linearGradient id="glassG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#B8D4D0"/>
      <stop offset="0.5" stop-color="#8FA9A5"/>
      <stop offset="1" stop-color="#4A5654"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shG" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bgG)"/>

  <!-- شبكة -->
  <g stroke="#B8B2A0" stroke-width="1" opacity="0.4">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800 M0 500 H800"/>
    <path d="M100 0 V600 M200 0 V600 M300 0 V600 M400 0 V600 M500 0 V600 M600 0 V600 M700 0 V600"/>
  </g>

  <!-- ظل -->
  <ellipse cx="400" cy="470" rx="220" ry="26" fill="#0A3D38" opacity="0.2" filter="url(#shG)"/>

  <!-- الماوس باد الزجاجي -->
  <g transform="translate(400 340)">
    <g transform="skewX(-18)">
      <rect x="-210" y="-100" width="420" height="200" fill="#0A3D38" opacity="0.5" transform="translate(8 10)"/>
      <rect x="-210" y="-100" width="420" height="200" fill="url(#glassG)" stroke="#0A3D38" stroke-width="2.5"/>
      <rect x="-190" y="-82" width="380" height="60" fill="url(#shine)"/>
      <rect x="-195" y="-85" width="390" height="170" fill="none" stroke="#F4F1EA" stroke-width="1.5" opacity="0.5"/>
    </g>
  </g>

  <!-- انعكاس ضوء -->
  <circle cx="440" cy="300" r="80" fill="#FFFFFF" opacity="0.15"/>
  <circle cx="440" cy="300" r="60" fill="#FFFFFF" opacity="0.1"/>

  <!-- TOP LEFT -->
  <g transform="translate(40 60)">
    <rect x="0" y="0" width="140" height="30" fill="#0A3D38"/>
    <text x="70" y="20" text-anchor="middle" font-family="Orbitron, sans-serif" font-size="11" font-weight="800" letter-spacing="3" fill="#F4F1EA">GLASS</text>
  </g>

  <!-- TOP RIGHT -->
  <g transform="translate(760 60)">
    <text x="0" y="0" text-anchor="end" font-family="Orbitron, sans-serif" font-size="42" font-weight="900" fill="#0A3D38">01</text>
  </g>

  <!-- BOTTOM LEFT -->
  <g transform="translate(40 560)">
    <text x="0" y="0" font-family="Orbitron, sans-serif" font-size="14" font-weight="700" letter-spacing="4" fill="#0A3D38">48 × 43 × 4 CM</text>
  </g>

  <!-- BOTTOM RIGHT -->
  <g transform="translate(760 560)">
    <text x="0" y="0" text-anchor="end" font-family="Orbitron, sans-serif" font-size="12" font-weight="700" letter-spacing="3" fill="#6B7A76">SAWWA SOUQ</text>
  </g>
</svg>