<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>لوحة التحكم — SaWWA Souq</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@400;500;600;700;800&family=Orbitron:wght@400;500;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/identity.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/alerts.css" />
<link rel="stylesheet" href="css/admin.css" />
<link rel="stylesheet" href="css/rtl.css" />
<link rel="icon" type="image/png" href="assets/favicon.png" />
<style>
  .hidden, .modal-backdrop.hidden, #loginScreen.hidden, #adminApp.hidden, #productModal.hidden, #couponModal.hidden {
    display: none !important; visibility: hidden !important; opacity: 0 !important; pointer-events: none !important;
  }
  /* ستايلات مخصصة لصفحة تعديل المنتج الجديدة */
  .modal-card.large { max-width: 850px; }
  .modal-form.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .image-gallery-uploader { grid-column: 1 / -1; border: 2px dashed var(--border-2); border-radius: 12px; padding: 20px; background: var(--surface-2); text-align: center; cursor: pointer; }
  .image-gallery-uploader:hover { border-color: var(--teal-2); }
  .gallery-preview { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 15px; }
  .gallery-preview img { width: 80px; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); position: relative; }
  .gallery-item { position: relative; }
  .gallery-item .remove-img { position: absolute; top: -5px; right: -5px; background: #C03030; color: #fff; border: none; border-radius: 50%; width: 20px; height: 20px; font-size: 12px; cursor: pointer; display: grid; place-items: center; }
</style>
</head>
<body class="admin-body">

<div id="loginScreen" class="login-wrap">
  <div class="login-card">
    <img src="assets/logo.png" alt="SaWWA Souq" style="height:50px;margin:0 auto 16px;display:block" />
    <h1 class="font-en">ADMIN PANEL</h1>
    <p class="muted" style="font-size:12px;">أدخل كلمة المرور للدخول</p>
    <input type="password" id="pwd" placeholder="كلمة المرور" />
    <button class="btn primary full" id="loginBtn" style="padding:10px;">دخول</button>
    <p id="loginErr" class="error"></p>
  </div>
</div>

<div id="adminApp" class="hidden">
  <aside class="admin-sidebar" id="adminSidebar">
    <div class="sidebar-head">
      <a href="index.html" class="logo" aria-label="SaWWA Souq"><img src="assets/logo.png" alt="SaWWA Souq" style="height:36px;" /></a>
      <button class="sidebar-close" id="sidebarClose">×</button>
    </div>
    <nav class="sidebar-nav">
      <button class="side-tab active" data-tab="dash"><span class="icon">📊</span><span>نظرة عامة</span></button>
      <button class="side-tab" data-tab="orders"><span class="icon">🛒</span><span>الطلبات</span><span class="side-badge" id="badge-orders"></span></button>
      <button class="side-tab" data-tab="products"><span class="icon">📦</span><span>المنتجات</span></button>
      <button class="side-tab" data-tab="inventory"><span class="icon">🏷️</span><span>المخزون</span><span class="side-badge warn" id="badge-low"></span></button>
      <button class="side-tab" data-tab="customers"><span class="icon">👥</span><span>العملاء</span></button>
      <button class="side-tab" data-tab="reviews"><span class="icon">⭐</span><span>المراجعات</span><span class="side-badge" id="badge-reviews"></span></button>
      <button class="side-tab" data-tab="messages"><span class="icon">✉️</span><span>الرسائل</span><span class="side-badge" id="badge-messages"></span></button>
      <button class="side-tab" data-tab="coupons"><span class="icon">🎟️</span><span>كوبونات</span></button>
      <button class="side-tab" data-tab="loyalty"><span class="icon">💎</span><span>النقاط</span></button>
      <button class="side-tab" data-tab="analytics"><span class="icon">📈</span><span>التحليلات</span></button>
      <button class="side-tab" data-tab="notifications"><span class="icon">🔔</span><span>الإشعارات</span></button>
      <button class="side-tab" data-tab="announce"><span class="icon">📣</span><span>إعلان الموقع</span></button>
      <button class="side-tab" data-tab="settings"><span class="icon">⚙️</span><span>الإعدادات</span></button>
      <button class="side-tab" data-tab="backup"><span class="icon">💾</span><span>نسخ احتياطي</span></button>
    </nav>
    <div class="sidebar-foot">
      <a href="index.html" class="btn ghost full small">← عرض الموقع</a>
      <button class="btn ghost full small" id="logoutBtn">تسجيل الخروج</button>
    </div>
  </aside>

  <main class="admin-main">
    <header class="admin-topbar">
      <button class="menu-toggle" id="menuToggle">☰</button>
      <h2 class="topbar-title" id="topbarTitle">نظرة عامة</h2>
      <div class="topbar-actions">
        <span class="live-dot"></span>
        <span class="muted" id="currentTime"></span>
      </div>
    </header>

    <div class="admin-content">
      <!-- تم اختصار باقي الأقسام لأنها ما تغيرت، التركيز على المنتجات -->
      <section class="tab-panel active" id="tab-dash">
        <div class="stats">
          <div class="stat"><div class="stat-ico">🛒</div><span>إجمالي الطلبات</span><strong id="stOrders">0</strong><small class="muted" id="stOrdersToday">+0 اليوم</small></div>
          <div class="stat"><div class="stat-ico">💰</div><span>إجمالي المبيعات</span><strong id="stRevenue">0</strong><small class="muted" id="stRevenueToday">+0 اليوم</small></div>
          <div class="stat"><div class="stat-ico">⏳</div><span>طلبات معلّقة</span><strong id="stPending">0</strong><small class="muted">بانتظار التحقق</small></div>
          <div class="stat"><div class="stat-ico">⚠️</div><span>مخزون منخفض</span><strong id="stLow">0</strong><small class="muted">≤ 10 وحدات</small></div>
        </div>
        <div class="dash-grid">
          <div class="dash-card"><h3>مبيعات آخر 7 أيام</h3><div class="chart-container" id="chartContainer"><canvas id="chartSales"></canvas></div></div>
          <div class="dash-card"><h3>أفضل 5 منتجات</h3><div id="topProducts"></div></div>
        </div>
      </section>

      <section class="tab-panel" id="tab-products">
        <div class="panel-toolbar">
          <button class="btn primary small" id="newProductBtn">+ منتج جديد</button>
          <input type="search" id="prodSearch" placeholder="ابحث..." />
          <select id="prodFilterType">
            <option value="">الكل</option>
            <option value="RUBBER">مطاطي</option>
            <option value="GLASS">زجاجي</option>
          </select>
        </div>
        <div id="prodTable" class="table-wrapper"></div>
      </section>

      <!-- باقي الأقسام (الطلبات، المخزون، إلخ) نفس الكود القديم، لم أضعها هنا لتوفير المساحة ولكنها موجودة في ملفك الأصلي -->
      <!-- ... -->
      
    </div>
  </main>
</div>

<!-- نافذة إضافة/تعديل المنتج الجديدة -->
<div id="productModal" class="modal-backdrop hidden">
  <div class="modal-card large">
    <h3 id="prodModalTitle" style="text-align:start; margin-bottom: 20px;">منتج جديد</h3>
    
    <div class="modal-form grid-2">
      <!-- العمود الأول -->
      <label><span>الاسم (عربي) *</span><input type="text" id="pm_nameAr" /></label>
      <label><span>الاسم (إنجليزي) *</span><input type="text" id="pm_nameEn" /></label>
      
      <label><span>الوصف (عربي)</span><textarea id="pm_descAr" rows="3"></textarea></label>
      <label><span>الوصف (إنجليزي)</span><textarea id="pm_descEn" rows="3"></textarea></label>

      <label><span>النوع</span><select id="pm_type"><option value="RUBBER">مطاطي</option><option value="GLASS">زجاجي</option></select></label>
      <label><span>الحزمة (التغليف)</span><input type="text" id="pm_pkg" /></label>

      <label><span>السعر (قرش) *</span><input type="number" id="pm_price" /></label>
      <label><span>سعر قبل الخصم (قرش)</span><input type="number" id="pm_compare" /></label>

      <label><span>سعر التكلفة (قرش)</span><input type="number" id="pm_cost" /></label>
      <label><span>المخزون *</span><input type="number" id="pm_stock" /></label>

      <!-- معرض الصور (يمتد على العرض بالكامل) -->
      <div class="image-gallery-uploader" id="pm_drop">
        <div class="iu-icon" style="font-size: 30px; margin-bottom: 8px;">🖼️</div>
        <div style="font-weight: 700; margin-bottom: 4px;">صور المنتج</div>
        <div class="muted" style="font-size: 12px;">اضغط هنا أو اسحب الصور لرفعها (يدعم صور متعددة)</div>
        <input type="file" id="pm_files" accept="image/*" multiple hidden />
        <div class="gallery-preview" id="pm_gallery_preview"></div>
      </div>
    </div>

    <div class="modal-actions" style="margin-top: 24px;">
      <button class="btn primary small" id="pm_save">حفظ المنتج</button>
      <button class="btn ghost small" id="pm_cancel">إلغاء</button>
    </div>
  </div>
</div>

<script src="js/supabase-config.js"></script>
<script src="js/supabase.js"></script>
<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/store.js"></script>
<script src="js/cart.js"></script>
<script src="js/ui.js"></script>
<script src="js/admin.js"></script>
<script src="js/invoice.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const menuToggle = document.getElementById('menuToggle');
    const sidebar = document.querySelector('.admin-sidebar');
    const sidebarClose = document.getElementById('sidebarClose');
    if (menuToggle) menuToggle.addEventListener('click', () => sidebar.classList.add('open'));
    if (sidebarClose) sidebarClose.addEventListener('click', () => sidebar.classList.remove('open'));
  });
</script>
</body>
</html>
